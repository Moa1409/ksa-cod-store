<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Lamsa Glow · Admin</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    :root {
      --primary: #6B2D3C;
      --primary-dark: #4F2130;
      --ink: #1A1014;
      --pearl: #F8F4F5;
      --muted: #7A6A6E;
      --gold: #C4A35A;
      --err: #C0392B;
      --ok: #2E7D5B;
      --line: #F0E4E7;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--pearl);
      color: var(--ink);
    }
    .hidden { display: none !important; }
    #login-view {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background:
        radial-gradient(60% 50% at 100% 0%, rgba(107,45,60,.12), transparent 60%),
        radial-gradient(50% 40% at 0% 20%, rgba(196,163,90,.12), transparent 60%),
        var(--pearl);
    }
    .card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      box-shadow: 0 8px 30px rgba(26,16,20,.08);
      padding: 1.75rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .logo {
      width: 64px; height: 64px; border-radius: 999px;
      object-fit: cover; box-shadow: 0 4px 16px rgba(26,16,20,.12);
    }
    h1 { margin: .75rem 0 0; font-size: 1.5rem; }
    .sub { color: var(--primary); font-weight: 700; margin-top: .25rem; }
    .muted { color: var(--muted); font-size: .875rem; }
    label { display: block; font-weight: 700; font-size: .875rem; margin-top: 1rem; text-align: left; }
    input, select, textarea, button { font: inherit; }
    input, select, textarea {
      width: 100%; margin-top: .35rem; padding: .65rem .75rem;
      border: 1px solid var(--line); border-radius: .75rem; background: #fff;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
      border: 0; border-radius: 999px; padding: .75rem 1.25rem;
      font-weight: 700; cursor: pointer; background: var(--primary); color: #fff;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.25); }
    .err { color: var(--err); font-size: .875rem; margin-top: .75rem; text-align: left; }
    header { background: var(--ink); color: #fff; padding: 1rem; }
    .wrap { max-width: 1120px; margin: 0 auto; }
    .row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: .75rem; }
    .brand img { width: 44px; height: 44px; border-radius: 999px; border: 2px solid rgba(196,163,90,.5); }
    .tabs { display: flex; gap: .5rem; margin-top: .75rem; }
    .tab {
      border-radius: 999px; padding: .4rem 1rem; border: 0; cursor: pointer;
      font-weight: 700; background: rgba(255,255,255,.1); color: #fff;
    }
    .tab.active { background: var(--primary); }
    .presets { display: flex; gap: .25rem; background: rgba(255,255,255,.1); padding: .2rem; border-radius: 999px; }
    .presets button {
      border: 0; background: transparent; color: #fff; font-weight: 700;
      font-size: .75rem; padding: .35rem .65rem; border-radius: 999px; cursor: pointer;
    }
    .presets button:hover { background: rgba(255,255,255,.12); }
    main { padding: 1rem; }
    .grid { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .grid-2 { display: grid; gap: 1rem; grid-template-columns: 1fr; }
    @media (min-width: 900px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
    .metric, .panel {
      background: #fff; border: 1px solid var(--line); border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(26,16,20,.05);
    }
    .metric { padding: 1rem; }
    .metric .k { font-size: .7rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .metric .v { font-size: 1.45rem; font-weight: 800; margin-top: .25rem; font-variant-numeric: tabular-nums; }
    .metric .h { font-size: .7rem; color: var(--muted); margin-top: .35rem; }
    .panel { padding: 1rem; margin-top: 1rem; }
    .panel h2 { margin: 0 0 .25rem; font-size: 1.05rem; }
    table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    th, td { padding: .65rem .5rem; border-bottom: 1px solid var(--line); text-align: left; }
    th { background: var(--ink); color: #fff; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover { background: rgba(240,228,231,.55); }
    .toolbar { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .75rem; }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      display: grid; place-items: center; padding: 1rem; z-index: 50;
    }
    .modal {
      background: #fff; width: 100%; max-width: 480px; max-height: 90vh;
      overflow: auto; border-radius: 1.25rem; padding: 1.25rem;
    }
    .flex-between { display: flex; justify-content: space-between; gap: .5rem; align-items: center; }
    code, .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: embed; }
    .bar-track { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: .35rem; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--gold)); border-radius: 999px; }
    svg.chart { width: 100%; height: auto; display: block; }
    .legend { display: flex; gap: 1rem; font-size: .75rem; font-weight: 700; margin-bottom: .5rem; }
    .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; margin-right: .35rem; }
  </style>
</head>
<body>
  <div id="login-view">
    <form class="card" id="login-form">
      <img class="logo" src="/logo.png" alt="Lamsa Glow" width="64" height="64" />
      <h1>Lamsa Glow</h1>
      <div class="sub">COD Admin Dashboard</div>
      <p class="muted">Metrics count Saudi Arabia traffic only (MaxMind · no VPN).</p>
      <label>Username
        <input id="username" autocomplete="username" required />
      </label>
      <label>Password
        <input id="password" type="password" autocomplete="current-password" required />
      </label>
      <div id="login-error" class="err hidden"></div>
      <button class="btn" style="width:100%;margin-top:1.25rem" type="submit">Sign in</button>
    </form>
  </div>

  <div id="app-view" class="hidden">
    <header>
      <div class="wrap">
        <div class="row">
          <div class="brand">
            <img src="/logo.png" alt="Lamsa Glow" width="40" height="40" />
            <div>
              <strong>Lamsa Glow Admin</strong>
              <div class="muted" style="color:#d8c7cb">COD dashboard · KSA traffic only</div>
            </div>
          </div>
          <div class="row" style="gap:.5rem">
            <div class="presets">
              <button type="button" data-days="7">7D</button>
              <button type="button" data-days="30">30D</button>
              <button type="button" data-days="90">90D</button>
            </div>
            <label class="muted" style="color:#fff;margin:0">From
              <input type="date" id="from" style="width:auto;margin:0 .25rem" />
            </label>
            <label class="muted" style="color:#fff;margin:0">To
              <input type="date" id="to" style="width:auto;margin:0 .25rem" />
            </label>
            <button type="button" class="btn btn-ghost" id="btn-refresh">Refresh</button>
            <button type="button" class="btn btn-ghost" id="btn-logout">Sign out</button>
          </div>
        </div>
        <div class="tabs">
          <button type="button" class="tab active" data-tab="overview">Overview</button>
          <button type="button" class="tab" data-tab="orders">Orders</button>
        </div>
      </div>
    </header>
    <main class="wrap">
      <div id="error" class="err hidden"></div>
      <section id="tab-overview"></section>
      <section id="tab-orders" class="hidden"></section>
    </main>
  </div>

  <div id="modal" class="modal-bg hidden">
    <div class="modal" id="modal-body"></div>
  </div>

<script>
(function () {
  const TOKEN_KEY = "lg_admin_token";
  // Same-origin first (Next /api/admin proxy or api.* host). Cross-origin only as last resort.
  const API =
    location.hostname === "localhost" ||
    location.hostname === "127.0.0.1" ||
    location.hostname.startsWith("api.") ||
    location.port === "8000" ||
    location.port === "3000"
      ? ""
      : "https://api.lamsaglow.shop";

  const STATUS = {
    new: "New", confirmed: "Confirmed", shipped: "Shipped",
    delivered: "Delivered", cancelled: "Cancelled", returned: "Returned"
  };

  function $(id) { return document.getElementById(id); }
  function show(el, on) { el.classList.toggle("hidden", !on); }
  function num(n, opts) {
    return Number(n || 0).toLocaleString("en-US", Object.assign({ maximumFractionDigits: 0 }, opts || {}));
  }
  function money(n) { return "SAR " + num(n); }
  function pct(n) { return num(n, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%"; }
  function iso(d) { return d.toISOString().slice(0, 10); }
  function defaultRange(days) {
    const to = new Date();
    const from = new Date();
    from.setDate(to.getDate() - (days - 1));
    return { from: iso(from), to: iso(to) };
  }
  function getToken() { return sessionStorage.getItem(TOKEN_KEY); }
  function setToken(t) { sessionStorage.setItem(TOKEN_KEY, t); }
  function clearToken() { sessionStorage.removeItem(TOKEN_KEY); }

  async function api(path, opts) {
    opts = opts || {};
    const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    const t = getToken();
    if (t) headers.Authorization = "Bearer " + t;
    const res = await fetch(API + path, Object.assign({}, opts, { headers }));
    const data = await res.json().catch(function () { return {}; });
    if (res.status === 401) { clearToken(); boot(); throw new Error("unauthorized"); }
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : ("HTTP " + res.status));
    return data;
  }

  function mergeDaily(m) {
    const map = {};
    (m.daily.orders || []).forEach(function (d) {
      map[d.day] = { day: d.day, orders: d.count, revenue: d.revenue, views: 0, clicks: 0 };
    });
    (m.daily.page_views || []).forEach(function (d) {
      if (!map[d.day]) map[d.day] = { day: d.day, orders: 0, revenue: 0, views: 0, clicks: 0 };
      map[d.day].views = d.count;
    });
    (m.daily.clicks || []).forEach(function (d) {
      if (!map[d.day]) map[d.day] = { day: d.day, orders: 0, revenue: 0, views: 0, clicks: 0 };
      map[d.day].clicks = d.count;
    });
    return Object.keys(map).sort().map(function (k) { return map[k]; });
  }

  function lineChart(points, keyA, keyB, colorA, colorB) {
    if (!points.length) return '<p class="muted">No data in this range</p>';
    var w = 640, h = 200, l = 36, r = 12, t = 12, b = 28;
    var iw = w - l - r, ih = h - t - b;
    var maxA = Math.max.apply(null, points.map(function (p) { return p[keyA]; }).concat([1]));
    var maxB = Math.max.apply(null, points.map(function (p) { return p[keyB]; }).concat([1]));
    function x(i) { return l + (i / Math.max(points.length - 1, 1)) * iw; }
    function yA(v) { return t + ih - (v / maxA) * ih; }
    function yB(v) { return t + ih - (v / maxB) * ih; }
    function path(key, yfn) {
      return points.map(function (p, i) {
        return (i ? "L" : "M") + " " + x(i) + " " + yfn(p[key]);
      }).join(" ");
    }
    return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<path d="' + path(keyA, yA) + '" fill="none" stroke="' + colorA + '" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<path d="' + path(keyB, yB) + '" fill="none" stroke="' + colorB + '" stroke-width="2.5" stroke-linejoin="round"/>' +
      '</svg>';
  }

  async function login(e) {
    e.preventDefault();
    show($("login-error"), false);
    try {
      var data = await fetch(API + "/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: $("username").value.trim(),
          password: $("password").value
        })
      }).then(async function (r) {
        var j = await r.json().catch(function () { return {}; });
        if (r.status === 404) throw new Error("Admin API not deployed yet. Rebuild the backend in EasyPanel, then retry.");
        if (!r.ok) throw new Error((typeof j.detail === "string" ? j.detail : null) || "Login failed");
        return j;
      });
      setToken(data.token);
      boot();
    } catch (err) {
      $("login-error").textContent = err.message || "Login failed";
      show($("login-error"), true);
    }
  }

  async function loadOverview() {
    var from = $("from").value;
    var to = $("to").value;
    var m = await api("/api/admin/metrics?from=" + from + "&to=" + to);
    var daily = mergeDaily(m);
    var topMax = Math.max.apply(null, (m.top_products || []).map(function (p) { return p.qty; }).concat([1]));
    var el = $("tab-overview");
    el.innerHTML =
      '<div class="grid">' +
        metric("Page views", num(m.traffic.page_views), "KSA · no VPN") +
        metric("Clicks", num(m.traffic.clicks), "CTA clicks") +
        metric("Unique sessions", num(m.traffic.unique_sessions), "") +
        metric("Blocked / non-KSA", num(m.traffic.blocked_or_non_ksa_events), "Excluded") +
        metric("Orders", num(m.orders.count), "") +
        metric("Revenue", money(m.orders.revenue), "") +
        metric("AOV", money(m.orders.aov), "") +
        metric("Session → order", pct(m.conversion.session_to_order_pct),
          "Click→order " + pct(m.conversion.click_to_order_pct)) +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="panel"><h2>Store growth — orders & revenue</h2>' +
          '<div class="legend"><span><span class="dot" style="background:#6B2D3C"></span>Orders</span>' +
          '<span><span class="dot" style="background:#C4A35A"></span>Revenue</span></div>' +
          lineChart(daily, "orders", "revenue", "#6B2D3C", "#C4A35A") +
        '</div>' +
        '<div class="panel"><h2>Traffic growth — views & clicks</h2>' +
          '<div class="legend"><span><span class="dot" style="background:#6B2D3C"></span>Views</span>' +
          '<span><span class="dot" style="background:#C4A35A"></span>Clicks</span></div>' +
          lineChart(daily, "views", "clicks", "#6B2D3C", "#C4A35A") +
        '</div>' +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="panel"><h2>Orders by status</h2><ul>' +
          (Object.keys(m.orders.by_status).length
            ? Object.entries(m.orders.by_status).map(function (pair) {
                return '<li class="flex-between"><span>' + (STATUS[pair[0]] || pair[0]) + '</span><strong class="num">' + num(pair[1]) + '</strong></li>';
              }).join("")
            : '<li class="muted">No orders</li>') +
        '</ul><div class="muted" style="margin-top:.75rem">Upsell rate: <strong>' + pct(m.orders.upsell_rate) +
        '</strong> (' + num(m.orders.upsells) + ' of ' + num(m.orders.count) + ')</div></div>' +
        '<div class="panel"><h2>Top products</h2>' +
          (m.top_products.length ? m.top_products.map(function (p) {
            var w = Math.max(4, (p.qty / topMax) * 100);
            return '<div style="margin:.65rem 0"><div class="flex-between"><strong>' + p.name +
              '</strong><span class="muted num">×' + num(p.qty) + ' · ' + money(p.revenue) +
              '</span></div><div class="bar-track"><div class="bar-fill" style="width:' + w + '%"></div></div></div>';
          }).join("") : '<p class="muted">—</p>') +
        '</div>' +
      '</div>' +
      '<div class="panel"><h2>Daily breakdown</h2><table><thead><tr>' +
        '<th>Day</th><th>Orders</th><th>Revenue</th><th>Views</th><th>Clicks</th></tr></thead><tbody>' +
        (daily.length ? daily.map(function (d) {
          return '<tr><td class="num">' + d.day + '</td><td class="num">' + num(d.orders) +
            '</td><td class="num">' + money(d.revenue) + '</td><td class="num">' + num(d.views) +
            '</td><td class="num">' + num(d.clicks) + '</td></tr>';
        }).join("") : '<tr><td colspan="5" class="muted" style="text-align:center;padding:2rem">No daily rows</td></tr>') +
      '</tbody></table><p class="muted">' + (m.traffic.note || "") + '</p></div>';
  }

  function metric(k, v, h) {
    return '<div class="metric"><div class="k">' + k + '</div><div class="v">' + v +
      '</div>' + (h ? '<div class="h">' + h + '</div>' : '') + '</div>';
  }

  var page = 1;
  async function loadOrders() {
    var from = $("from").value;
    var to = $("to").value;
    var status = ($("order-status") && $("order-status").value) || "";
    var q = ($("order-q") && $("order-q").value) || "";
    var sp = new URLSearchParams({ from: from, to: to, page: String(page), page_size: "25", valid_geo_only: "true" });
    if (status) sp.set("status", status);
    if (q) sp.set("q", q);
    var data = await api("/api/admin/orders?" + sp.toString());
    var el = $("tab-orders");
    el.innerHTML =
      '<div class="toolbar">' +
        '<input id="order-q" placeholder="Search: order # / name / phone / city" value="' + q.replace(/"/g, "&quot;") + '" style="flex:1;min-width:180px" />' +
        '<select id="order-status"><option value="">All statuses</option>' +
          Object.keys(STATUS).map(function (s) {
            return '<option value="' + s + '"' + (s === status ? " selected" : "") + '>' + STATUS[s] + '</option>';
          }).join("") +
        '</select><button type="button" class="btn" id="btn-search">Apply</button></div>' +
      '<div class="panel" style="padding:0;overflow:hidden"><table><thead><tr>' +
        '<th>Order</th><th>Customer</th><th>City</th><th>Total</th><th>Status</th><th>Geo</th></tr></thead><tbody>' +
        (data.orders.map(function (o) {
          return '<tr class="clickable" data-order="' + o.order_number + '">' +
            '<td><code>' + o.order_number + '</code></td>' +
            '<td><strong>' + o.customer_name + '</strong><div class="muted"><code>' + o.phone + '</code></div></td>' +
            '<td>' + (o.city || "—") + '</td>' +
            '<td><strong class="num">' + money(o.total) + '</strong></td>' +
            '<td>' + (STATUS[o.status] || o.status) + '</td>' +
            '<td class="muted">' + ((o.geo && o.geo.country) || "—") + ((o.geo && o.geo.vpn) ? " · VPN" : "") + '</td></tr>';
        }).join("") || '<tr><td colspan="6" class="muted" style="text-align:center;padding:2rem">No orders</td></tr>') +
      '</tbody></table>' +
      '<div class="flex-between" style="padding:.75rem">' +
        '<span class="muted num">' + num(data.total) + ' orders · page ' + num(data.page) + '</span><div>' +
        '<button type="button" class="btn" id="prev"' + (page <= 1 ? " disabled" : "") + '>Previous</button> ' +
        '<button type="button" class="btn" id="next"' + (page * 25 >= data.total ? " disabled" : "") + '>Next</button>' +
      '</div></div></div>';
    $("btn-search").onclick = function () { page = 1; safe(loadOrders); };
    $("prev").onclick = function () { page = Math.max(1, page - 1); safe(loadOrders); };
    $("next").onclick = function () { page += 1; safe(loadOrders); };
    el.querySelectorAll("tr[data-order]").forEach(function (tr) {
      tr.onclick = function () { openOrder(tr.getAttribute("data-order")); };
    });
  }

  async function openOrder(numOrder) {
    var o = await api("/api/admin/orders/" + encodeURIComponent(numOrder));
    var modal = $("modal");
    var body = $("modal-body");
    body.innerHTML =
      '<div class="flex-between"><div><div class="muted">Order detail</div><strong><code>' + o.order_number +
      '</code></strong></div><button type="button" class="btn" id="close-modal">Close</button></div>' +
      '<p><span class="muted">Name:</span> <strong>' + o.customer_name + '</strong></p>' +
      '<p><span class="muted">Phone:</span> <code>' + o.phone + '</code></p>' +
      '<p><span class="muted">City:</span> ' + (o.city || "—") + '</p>' +
      '<p><span class="muted">Total:</span> <strong class="num">' + money(o.total) + '</strong></p>' +
      '<p><span class="muted">Geo:</span> ' + ((o.geo && o.geo.country) || "—") +
      ' · allowed=' + (o.geo && o.geo.allowed) + ' · vpn=' + (o.geo && o.geo.vpn) + '</p>' +
      '<div><strong>Items</strong><ul>' + o.items.map(function (i) {
        return '<li class="flex-between"><span>' + i.name + ' ×' + num(i.qty) + (i.upsell ? " (upsell)" : "") +
          '</span><span class="num">' + money(i.unit_price * i.qty) + '</span></li>';
      }).join("") + '</ul></div>' +
      '<label>Status<select id="edit-status">' + Object.keys(STATUS).map(function (s) {
        return '<option value="' + s + '"' + (s === o.status ? " selected" : "") + '>' + STATUS[s] + '</option>';
      }).join("") + '</select></label>' +
      '<label>Notes<textarea id="edit-notes" rows="3">' + (o.notes || "").replace(/</g, "&lt;") + '</textarea></label>' +
      '<button type="button" class="btn" style="width:100%;margin-top:1rem" id="save-order">Save changes</button>';
    show(modal, true);
    $("close-modal").onclick = function () { show(modal, false); };
    $("save-order").onclick = async function () {
      await api("/api/admin/orders/" + encodeURIComponent(numOrder), {
        method: "PATCH",
        body: JSON.stringify({ status: $("edit-status").value, notes: $("edit-notes").value })
      });
      show(modal, false);
      await loadOrders();
    };
  }

  function setTab(name) {
    document.querySelectorAll(".tab").forEach(function (t) {
      t.classList.toggle("active", t.dataset.tab === name);
    });
    show($("tab-overview"), name === "overview");
    show($("tab-orders"), name === "orders");
    if (name === "overview") safe(loadOverview);
    else safe(loadOrders);
  }

  async function safe(fn) {
    show($("error"), false);
    try { await fn(); }
    catch (e) {
      if (e.message === "unauthorized") return;
      $("error").textContent = e.message || "Error";
      show($("error"), true);
    }
  }

  function boot() {
    var authed = !!getToken();
    show($("login-view"), !authed);
    show($("app-view"), authed);
    if (!authed) return;
    var r = defaultRange(30);
    if (!$("from").value) $("from").value = r.from;
    if (!$("to").value) $("to").value = r.to;
    setTab("overview");
  }

  $("login-form").addEventListener("submit", login);
  $("btn-logout").onclick = function () { clearToken(); boot(); };
  $("btn-refresh").onclick = function () {
    var active = document.querySelector(".tab.active");
    setTab(active ? active.dataset.tab : "overview");
  };
  document.querySelectorAll(".tab").forEach(function (t) {
    t.onclick = function () { setTab(t.dataset.tab); };
  });
  document.querySelectorAll(".presets button").forEach(function (b) {
    b.onclick = function () {
      var r = defaultRange(Number(b.getAttribute("data-days")));
      $("from").value = r.from;
      $("to").value = r.to;
      var active = document.querySelector(".tab.active");
      setTab(active ? active.dataset.tab : "overview");
    };
  });
  $("modal").addEventListener("click", function (e) {
    if (e.target.id === "modal") show($("modal"), false);
  });

  boot();
})();
</script>
</body>
</html>
